---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "00 PR Gate"

on:
  pull_request_target:
    branches: ["main"]
    types: ["opened", "reopened", "synchronize", "ready_for_review"]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-unauthorized-pr:
    name: Close Unauthorized Pull Request
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository || !contains(fromJSON('["jardt", "renovate[bot]"]'), github.event.pull_request.user.login) }}
    steps:
      - name: Close unauthorized pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR_URL" --comment "This repository only accepts pull requests opened by the owner or Renovate."

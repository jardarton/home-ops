apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.model == "M4-CT256M4SSD3"
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  intel.feature.node.kubernetes.io/gpu: "false"
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: hp-3
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("ec:a8:6b:f4:58:5b", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: ethSel0
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500

# Same as controlplane, plus netconsole, which sends kernel output (including panics) to bigbox.
customization:
  extraKernelArgs:
    - -selinux
    - apparmor=0
    - init_on_alloc=0
    - init_on_free=0
    - mitigations=off
    - net.ifnames=0
    - security=none
    - talos.auditd.disabled=1
    - i915.enable_guc=2 # Meteor Lake CPU & Intel iGPU
    - netconsole=6665@192.168.1.21/bond0,6666@192.168.1.10/
  systemExtensions:
    officialExtensions:
      - siderolabs/intel-ucode
      - siderolabs/i915 # Intel iGPU

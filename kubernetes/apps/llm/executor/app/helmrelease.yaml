# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: executor
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template-v5
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      executor:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsUser: 10000
        containers:
          app:
            image:
              repository: ghcr.io/usefulsoftwareco/executor-selfhost
              tag: 1.6.10@sha256:b9e001775d3eb7d662d347c8f7054333c78c1a4fd97cb5a86dc1d1d1406093b9
            env:
              EXECUTOR_WEB_BASE_URL: https://executor.${SECRET_DOMAIN}
              EXECUTOR_ALLOW_LOCAL_NETWORK: "true"
              TZ: Europe/Oslo
            ports:
              - containerPort: &httpPort 4788
                name: http
                protocol: TCP
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *httpPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
                  initialDelaySeconds: 20
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
      specs:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsGroup: 10000
            runAsUser: 10000
        containers:
          app:
            image:
              repository: ghcr.io/static-web-server/static-web-server
              tag: 2.44.1@sha256:94618e3d17802265a21926217e6f9e7832b311b6fbf5933684001739fafed06a
            env:
              SERVER_PORT: &specsPort 8080
              SERVER_ROOT: /public
              SERVER_HEALTH: "true"
              SERVER_DIRECTORY_LISTING: "false"
              # ConfigMap files are symlinks; containment in SERVER_ROOT is still enforced.
              SERVER_DISABLE_SYMLINKS: "false"
            probes:
              liveness: &specsProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *specsPort
                  periodSeconds: 30
              readiness: *specsProbes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    persistence:
      data:
        existingClaim: executor
        advancedMounts:
          executor:
            app:
              - path: /data
      specs:
        type: configMap
        name: executor-specs
        advancedMounts:
          specs:
            app:
              - path: /public
                readOnly: true
    service:
      app:
        controller: executor
        forceRename: executor
        ports:
          http:
            port: *httpPort
      specs:
        controller: specs
        ports:
          http:
            port: *specsPort
    route:
      app:
        hostnames:
          - "executor.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

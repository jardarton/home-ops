openapi: 3.0.3
info:
  title: qBittorrent Web API
  version: "2.11"
  description: >-
    Subset of the qBittorrent 5.x Web API (v2). Hashes parameters take one or more
    torrent info-hashes separated by "|", or "all".
servers:
  - url: http://qbittorrent.downloads.svc.cluster.local:8888/api/v2
security:
  - webApiKey: []
tags:
  - name: app
  - name: transfer
  - name: torrents
paths:
  /app/version:
    get:
      operationId: getAppVersion
      tags: [app]
      summary: qBittorrent application version
      responses:
        "200":
          description: Version string, e.g. v5.2.3
          content:
            text/plain:
              schema: {type: string}
  /app/webapiVersion:
    get:
      operationId: getWebApiVersion
      tags: [app]
      summary: Web API version
      responses:
        "200":
          description: Version string
          content:
            text/plain:
              schema: {type: string}
  /app/defaultSavePath:
    get:
      operationId: getDefaultSavePath
      tags: [app]
      summary: Default save path for new torrents
      responses:
        "200":
          description: Path
          content:
            text/plain:
              schema: {type: string}
  /transfer/info:
    get:
      operationId: getTransferInfo
      tags: [transfer]
      summary: Global transfer info (speeds, totals, connection status)
      responses:
        "200":
          description: Transfer info
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TransferInfo"}
  /torrents/info:
    get:
      operationId: listTorrents
      tags: [torrents]
      summary: List torrents, optionally filtered and sorted
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, downloading, seeding, completed, stopped, running, active, inactive, stalled, stalled_uploading, stalled_downloading, checking, moving, errored]
        - name: category
          in: query
          description: Category name; empty string means uncategorized
          schema: {type: string}
        - name: tag
          in: query
          description: Tag name; empty string means untagged
          schema: {type: string}
        - name: sort
          in: query
          description: Field to sort by, e.g. added_on, name, progress, dlspeed, size, ratio
          schema: {type: string}
        - name: reverse
          in: query
          schema: {type: boolean}
        - name: limit
          in: query
          schema: {type: integer}
        - name: offset
          in: query
          schema: {type: integer}
        - name: hashes
          in: query
          description: Hashes separated by "|"
          schema: {type: string}
      responses:
        "200":
          description: Torrents
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Torrent"}
  /torrents/properties:
    get:
      operationId: getTorrentProperties
      tags: [torrents]
      summary: Detailed properties of one torrent
      parameters:
        - {$ref: "#/components/parameters/Hash"}
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /torrents/trackers:
    get:
      operationId: getTorrentTrackers
      tags: [torrents]
      summary: Trackers of one torrent
      parameters:
        - {$ref: "#/components/parameters/Hash"}
      responses:
        "200":
          description: Trackers
          content:
            application/json:
              schema:
                type: array
                items: {type: object, additionalProperties: true}
  /torrents/files:
    get:
      operationId: getTorrentFiles
      tags: [torrents]
      summary: Files of one torrent
      parameters:
        - {$ref: "#/components/parameters/Hash"}
        - name: indexes
          in: query
          description: File indexes separated by "|". Omit to return all files.
          schema: {type: string}
      responses:
        "200":
          description: Files, or an empty array while torrent metadata is unavailable
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  required: [index, name, priority]
                  properties:
                    index: {type: integer, minimum: 0, description: File ID for setTorrentFilePriority}
                    name: {type: string}
                    priority: {$ref: "#/components/schemas/FilePriority"}
        "404": {description: Torrent not found}
        "409": {description: Invalid or out-of-range file index}
  /torrents/filePrio:
    post:
      operationId: setTorrentFilePriority
      tags: [torrents]
      summary: Select or skip files in an added torrent, or change their download priority
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [hash, id, priority]
              properties:
                hash: {type: string, description: Torrent info-hash}
                id:
                  type: string
                  description: File index values from getTorrentFiles, separated by "|".
                  example: "0|2"
                priority: {$ref: "#/components/schemas/FilePriority"}
      responses:
        "200": {description: Priority set}
        "400": {description: Invalid priority or non-integer file ID}
        "404": {description: Torrent not found}
        "409": {description: Torrent metadata is unavailable or a file index is out of range}
  /torrents/categories:
    get:
      operationId: listCategories
      tags: [torrents]
      summary: All categories, keyed by name
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /torrents/tags:
    get:
      operationId: listTags
      tags: [torrents]
      summary: All tags
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
  /torrents/fetchMetadata:
    post:
      operationId: fetchTorrentMetadata
      tags: [torrents]
      summary: Preview torrent files before adding a magnet link or .torrent URL
      description: >-
        If metadata is pending, retry with the same source until info.files is returned.
        Use the same connection and source in addTorrents to apply file priorities in that file order.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [source]
              properties:
                source: {type: string, description: Magnet link or .torrent URL}
      responses:
        "200":
          description: Torrent metadata including its file list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [info]
                properties:
                  hash: {type: string}
                  info:
                    type: object
                    additionalProperties: true
                    required: [files]
                    properties:
                      name: {type: string}
                      files:
                        type: array
                        items:
                          type: object
                          required: [path, length]
                          properties:
                            path: {type: string}
                            length: {type: integer, format: int64, description: File size in bytes}
        "202":
          description: Metadata is pending. The response contains any known hashes and may be empty.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {description: Invalid source or metadata could not be requested}
  /torrents/add:
    post:
      operationId: addTorrents
      tags: [torrents]
      summary: Add torrents from magnet links or URLs
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: string
                  description: Magnet links or .torrent URLs, one per line
                savepath: {type: string}
                category: {type: string}
                tags:
                  type: string
                  description: Comma-separated tags
                stopped:
                  type: boolean
                  description: Add in stopped state
                forced:
                  type: boolean
                  description: Start in forced mode, bypassing queue limits
                stopCondition:
                  type: string
                  enum: [None, MetadataReceived, FilesChecked]
                  description: Use MetadataReceived to stop a magnet after fetching metadata for file selection.
                filePriorities:
                  type: string
                  description: >-
                    For one link with metadata loaded by fetchTorrentMetadata, provide one comma-separated
                    priority per file in the returned order. Use 0 to skip, 1 for normal, 6 for high,
                    or 7 for maximum priority.
                  example: "1,0,6"
                sequentialDownload: {type: boolean}
                firstLastPiecePrio: {type: boolean}
      responses:
        "200":
          description: Torrent add results
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AddTorrentsResult"}
        "202":
          description: One or more torrent adds are pending
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AddTorrentsResult"}
        "400": {description: Invalid add parameters or file priorities}
        "409": {description: No torrents were added}
  /torrents/stop:
    post:
      operationId: stopTorrents
      tags: [torrents]
      summary: Stop (pause) torrents
      requestBody: {$ref: "#/components/requestBodies/Hashes"}
      responses:
        "200": {description: Ok}
  /torrents/start:
    post:
      operationId: startTorrents
      tags: [torrents]
      summary: Start (resume) torrents
      requestBody: {$ref: "#/components/requestBodies/Hashes"}
      responses:
        "200": {description: Ok}
  /torrents/setForceStart:
    post:
      operationId: setTorrentForceStart
      tags: [torrents]
      summary: Force start torrents or return them to normal queue management
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [hashes, value]
              properties:
                hashes: {type: string, description: 'Hashes separated by "|", or "all"'}
                value:
                  type: boolean
                  description: True starts in forced mode. False starts in normal queue-managed mode.
      responses:
        "200": {description: Start mode set}
        "400": {description: Missing required parameters}
  /torrents/recheck:
    post:
      operationId: recheckTorrents
      tags: [torrents]
      summary: Recheck torrent data
      requestBody: {$ref: "#/components/requestBodies/Hashes"}
      responses:
        "200": {description: Ok}
  /torrents/reannounce:
    post:
      operationId: reannounceTorrents
      tags: [torrents]
      summary: Reannounce torrents to their trackers
      requestBody: {$ref: "#/components/requestBodies/Hashes"}
      responses:
        "200": {description: Ok}
  /torrents/delete:
    post:
      operationId: deleteTorrents
      tags: [torrents]
      summary: Remove torrents, optionally deleting their downloaded files
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [hashes, deleteFiles]
              properties:
                hashes: {type: string, description: 'Hashes separated by "|", or "all"'}
                deleteFiles: {type: boolean}
      responses:
        "200": {description: Ok}
  /torrents/setCategory:
    post:
      operationId: setTorrentCategory
      tags: [torrents]
      summary: Set the category of torrents (empty string clears it)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [hashes, category]
              properties:
                hashes: {type: string}
                category: {type: string}
      responses:
        "200": {description: Ok}
        "409": {description: Category does not exist}
  /torrents/addTags:
    post:
      operationId: addTorrentTags
      tags: [torrents]
      summary: Add tags to torrents
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [hashes, tags]
              properties:
                hashes: {type: string}
                tags: {type: string, description: Comma-separated tags}
      responses:
        "200": {description: Ok}
  /torrents/removeTags:
    post:
      operationId: removeTorrentTags
      tags: [torrents]
      summary: Remove tags from torrents (empty tags removes all)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [hashes]
              properties:
                hashes: {type: string}
                tags: {type: string, description: Comma-separated tags}
      responses:
        "200": {description: Ok}
components:
  securitySchemes:
    webApiKey:
      type: http
      scheme: bearer
      description: qBittorrent Web API key (WebUI\\APIKey)
  parameters:
    Hash:
      name: hash
      in: query
      required: true
      description: Torrent info-hash
      schema: {type: string}
  requestBodies:
    Hashes:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [hashes]
            properties:
              hashes: {type: string, description: 'Hashes separated by "|", or "all"'}
  schemas:
    FilePriority:
      type: integer
      enum: [0, 1, 6, 7]
      description: 0 skips the file, 1 is normal, 6 is high, and 7 is maximum priority.
    AddTorrentsResult:
      type: object
      required: [success_count, failure_count, pending_count, added_torrent_ids]
      properties:
        success_count: {type: integer}
        failure_count: {type: integer}
        pending_count: {type: integer}
        added_torrent_ids:
          type: array
          items: {type: string}
    TransferInfo:
      type: object
      additionalProperties: true
      properties:
        dl_info_speed: {type: integer, description: "Download speed, bytes/s"}
        dl_info_data: {type: integer}
        up_info_speed: {type: integer, description: "Upload speed, bytes/s"}
        up_info_data: {type: integer}
        dl_rate_limit: {type: integer}
        up_rate_limit: {type: integer}
        dht_nodes: {type: integer}
        connection_status: {type: string}
    Torrent:
      type: object
      additionalProperties: true
      properties:
        hash: {type: string}
        force_start: {type: boolean, description: Whether the torrent is in forced mode}
        name: {type: string}
        state: {type: string}
        progress: {type: number}
        size: {type: integer}
        total_size: {type: integer}
        downloaded: {type: integer}
        uploaded: {type: integer}
        dlspeed: {type: integer}
        upspeed: {type: integer}
        eta: {type: integer}
        ratio: {type: number}
        num_seeds: {type: integer}
        num_leechs: {type: integer}
        category: {type: string}
        tags: {type: string}
        save_path: {type: string}
        content_path: {type: string}
        added_on: {type: integer}
        completion_on: {type: integer}
        tracker: {type: string}

# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
configMapGenerator:
  # OpenAPI specs served to Executor by the specs controller.
  - name: executor-specs
    files:
      - ./specs/qbittorrent.yaml
generatorOptions:
  disableNameSuffixHash: true

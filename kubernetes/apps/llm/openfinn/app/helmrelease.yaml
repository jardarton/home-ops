# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openfinn
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-v5
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
    controllers:
      # The hub: the store, market and labels, served to agents over MCP. FINN
      # itself is reached only through the connectors beside the phones.
      openfinn:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom:
              - secretRef:
                  name: openfinn-secret
        containers:
          app:
            image: &image
              repository: registry.${SECRET_DOMAIN}/openfinn-hub
              tag: c43c746@sha256:2340db126a8f078d976609cb6b1953051c2b2c55018703b5267a2ae85922084f
            env: &env
              TZ: Europe/Oslo
              # Reads take the logged-out phone first.
              OPENFINN_CONNECTORS: >-
                [{"name":"samsung","url":"http://192.168.1.10:4841/","token_file":"/secrets/CONNECTOR_TOKEN"},
                {"name":"cat","url":"http://192.168.1.10:4842/","token_file":"/secrets/CONNECTOR_TOKEN"}]
              OPENFINN_MCP_TOKEN_FILE: /secrets/MCP_TOKEN
              OPENFINN_IMAGES_BUCKET: openfinn-images
              OPENFINN_IMAGES_S3_ENDPOINT: http://192.168.1.10:3900
              OPENFINN_IMAGES_S3_ACCESS_KEY_ID_FILE: /secrets/S3_ACCESS_KEY_ID
              OPENFINN_IMAGES_S3_SECRET_ACCESS_KEY_FILE: /secrets/S3_SECRET_ACCESS_KEY
              OPENFINN_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: openfinn-secret
                    key: OPENFINN_DATABASE_URL
              OPENFINN_HOME_LOCATION:
                valueFrom:
                  secretKeyRef:
                    name: openfinn-secret
                    key: OPENFINN_HOME_LOCATION
            ports:
              - containerPort: &port 4830
                name: http
                protocol: TCP
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 6
                  failureThreshold: 3
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
      # Each morning: sync the watches, label what is new, post new deals.
      sync:
        type: cronjob
        cronjob:
          schedule: "30 6 * * *"
          timeZone: Europe/Oslo
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 0
        pod:
          restartPolicy: Never
          # Time for a stopped sync to cancel its call at the connector.
          terminationGracePeriodSeconds: 90
        containers:
          app:
            image: *image
            command: ["openfinn", "watch", "scheduled"]
            env:
              !!merge <<: *env
              OPENFINN_SYNC_HYDRATE: "50"
              OPENFINN_SYNC_THUMBNAILS: "true"
              OPENFINN_NTFY_URL: http://ntfy.observability.svc.cluster.local/jardar
              OPENFINN_NOTIFY_CHECK: kubectl -n llm logs -l app.kubernetes.io/controller=sync --tail=200
              OPENFINN_DEAL_ALERTS: >-
                [{"name":"iPads near home","watch":"ipad-tablets","segment":["type=tablet"],"by":["model"],"below":"q1","within":30,"allow_incomplete":true},
                {"name":"PS1 consoles","watch":"ps1-consoles","segment":["type=console","model=ps1"]}]
              OPENFINN_LABELING_COMMAND: '["openfinn-labeler"]'
              OPENFINN_LABELING_MAX_LISTINGS: "300"
              OPENFINN_LABELER_BASE_URL: http://cli-proxy-api.default.svc.cluster.local:8317
              OPENFINN_LABELER_API_KEY_FILE: /secrets/LABELER_API_KEY
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: openfinn
        ports:
          http:
            port: *port
    persistence:
      secrets:
        type: secret
        name: openfinn-secret
        globalMounts:
          - path: /secrets
            readOnly: true

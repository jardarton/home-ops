# The browser profile holds logged-in sessions, so it is not backed up: losing it
# only means logging in again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mikkel-rev-personal
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi

# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pippi
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-v5
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
    controllers:
      gateway:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: pippi
        containers:
          app:
            image:
              repository: registry.${SECRET_DOMAIN}/pippi
              tag: 88e0533@sha256:277213f6371a332b60bdf22cdc141580e4ea2e888c89a899b03f7d14fb35a76b
            args: ["gateway"]
            env:
              TZ: Europe/Oslo
              HOME: /tmp
              PIPPI_GATEWAY_HOST: 0.0.0.0
              PIPPI_GATEWAY_PORT: "4800"
              PIPPI_HOUSEHOLD: /etc/pippi/household.json
              PIPPI_DATA_DIR: /data
              PIPPI_WEB_DIR: /app/apps/web/dist
              PIPPI_KEEPER: kubernetes
              # The Bots run the Gateway's own image, and their Environments this one.
              PIPPI_BOT_IMAGE: registry.${SECRET_DOMAIN}/pippi:88e0533@sha256:277213f6371a332b60bdf22cdc141580e4ea2e888c89a899b03f7d14fb35a76b
              PIPPI_ENVIRONMENT_IMAGE: registry.${SECRET_DOMAIN}/pippi-environment:88e0533@sha256:5bbeaa290848443acdf8e8a4dfef9cc6db2f6a250497c00cfec5d2512f0eb4ad
              PIPPI_KUBERNETES_BOT_SECRET: pippi-bots
              PIPPI_KUBERNETES_HOUSEHOLD_SECRET: pippi-household
              PIPPI_KUBERNETES_PULL_SECRET: registry-pull
              # The Gateway lists Executor's integrations with the Bots' key, to offer them as Extensions.
              EXECUTOR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: pippi-bots
                    key: EXECUTOR_API_KEY
            envFrom:
              - secretRef:
                  name: pippi-secret
            ports:
              - containerPort: &httpPort 4800
                name: http
                protocol: TCP
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *httpPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 20m
                memory: 192Mi
              limits:
                memory: 1Gi
        pod:
          imagePullSecrets:
            - name: registry-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
    serviceAccount:
      pippi: {}
    rbac:
      roles:
        pippi-keeper:
          type: Role
          rules:
            # What the Keeper applies for each Bot.
            - apiGroups: [""]
              resources: ["serviceaccounts", "services", "persistentvolumeclaims"]
              verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
            - apiGroups: ["apps"]
              resources: ["statefulsets"]
              verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["roles", "rolebindings"]
              verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
            - apiGroups: ["volsync.backube"]
              resources: ["replicationsources"]
              verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
            # Waiting for a Bot's pods to go, and what each Bot's own Role grants on its Environment.
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["pods/exec"]
              verbs: ["get", "create"]
      bindings:
        pippi-keeper:
          type: RoleBinding
          roleRef:
            identifier: pippi-keeper
          subjects:
            - identifier: pippi
              serviceAccount: pippi
    persistence:
      data:
        existingClaim: pippi
        globalMounts:
          - path: /data
      household:
        type: secret
        name: pippi-household
        globalMounts:
          - path: /etc/pippi
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *httpPort
    route:
      app:
        hostnames:
          - "pippi.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

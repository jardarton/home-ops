# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          vuetorrent:
            image:
              repository: docker.io/library/alpine
              tag: 3.24
            command:
              - /bin/sh
              - -ec
              - |
                workdir="$(mktemp -d)"
                trap 'rm -rf "$workdir"' EXIT

                wget -O "$workdir/vuetorrent.zip" https://github.com/VueTorrent/VueTorrent/releases/download/v2.34.0/vuetorrent.zip
                unzip -q "$workdir/vuetorrent.zip" -d "$workdir"

                find /vuetorrent -mindepth 1 -maxdepth 1 -exec rm -rf {} \;
                cp -a "$workdir/vuetorrent/." /vuetorrent/
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsUser: 0
              capabilities: {drop: ["ALL"]}
          config:
            image:
              repository: docker.io/library/alpine
              tag: 3.24
            command:
              - /bin/sh
              - -ec
              - |
                rm -f /config/qBittorrent/config/lockfile /config/qBittorrent/config/ipc-socket
                config=/config/qBittorrent/config/qBittorrent.conf

                awk '
                  /^\[BitTorrent\]$/ {
                    print
                    print "Session\\DHTEnabled=false"
                    print "Session\\LSDEnabled=false"
                    print "Session\\PeXEnabled=false"
                    next
                  }
                  /^(DHT|LSD|PeX)=/ { next }
                  /^Session\\(DHT|LSD|PeX)Enabled=/ { next }
                  { print }
                ' "$config" > "$config.tmp"
                mv "$config.tmp" "$config"

                sed -i 's#^WebUI\\RootFolder=.*#WebUI\\RootFolder=/vuetorrent#' "$config"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsUser: 993
              runAsGroup: 995
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
            args:
              - --profile=/config
              - --webui-port=8888
              - --confirm-legal-notice
            env:
              TZ: Europe/Oslo
              QBT_WEBUI_PORT: &webuiPort 8888
              QBT_TORRENTING_PORT: &torrentPort 56855
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 993
        runAsGroup: 995
        fsGroup: 995
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *webuiPort
            primary: true
    route:
      app:
        hostnames: ["torrent.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
    persistence:
      config:
        type: nfs
        server: 192.168.1.10
        path: /mnt/wolf/arr/qbittorrent
        globalMounts:
          - path: /config
      torrents:
        type: nfs
        server: 192.168.1.10
        path: /mnt/wolf/torrents
        globalMounts:
          - path: /mnt/wolf/torrents
      vuetorrent:
        type: emptyDir
        globalMounts:
          - path: /vuetorrent
      tmp:
        type: emptyDir

# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slskd
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-v5
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      slskd:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/slskd/slskd
              tag: 0.26.2@sha256:d0963a3e5b16facd295bf4f2156dad0182f246b1b21a032cae12f5494c694843
            env:
              LIDARR_URL: http://lidarr.downloads.svc.cluster.local:8686
              SLSKD_CONFIG: /config/slskd.yml
              SLSKD_HTTP_PORT: &port 5030
              SLSKD_NO_HTTPS: "true"
              SLSKD_NO_VERSION_CHECK: "true"
              SLSKD_SLSK_LISTEN_PORT: 50300
              SLSKD_SWAGGER: "true"
              SLSKD_SHARED_DIR: /mnt/wolf/media/musikk/root
              SLSKD_SHARE_FILTER: \.ini$;Thumbs\.db$;\.DS_Store$
              SLSKD_DOWNLOADS_DIR: /mnt/wolf/media/musikk/soulseek/complete
              SLSKD_INCOMPLETE_DIR: /mnt/wolf/media/musikk/soulseek/incomplete
              SLSKD_REMOTE_FILE_MANAGEMENT: "true"
              SLSKD_UPLOAD_SLOTS: 2
              TZ: Europe/Oslo
            envFrom:
              - secretRef:
                  name: slskd-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 993
        runAsGroup: 995
        fsGroup: 995
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
    persistence:
      config:
        existingClaim: slskd
        globalMounts:
          - path: /app
      config-file:
        type: configMap
        name: slskd-configmap
        defaultMode: 0755
        globalMounts:
          - path: /config
            readOnly: true
      wolf:
        type: nfs
        server: 192.168.1.10
        path: /mnt/wolf
        globalMounts:
          - path: /mnt/wolf
      dotnet:
        type: emptyDir
        globalMounts:
          - path: /.net
      tmp:
        type: emptyDir

# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 88.2.0
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          # Single-cluster duplicate, and a CoreDNS dashboard whose metrics we lack
          # (the dotdc CoreDNS dashboard in Grafana's values covers it).
          - target:
              kind: ConfigMap
              name: kube-prometheus-stack-(k8s-resources-multicluster|k8s-coredns)
            patch: |
              $patch: delete
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: unused
          - target:
              kind: ConfigMap
              name: kube-prometheus-stack-(nodes|node-rsrc-use|node-cluster-rsrc-use)
            patch: |
              - op: replace
                path: /metadata/annotations/grafana_folder
                value: Nodes
          - target:
              kind: ConfigMap
              name: kube-prometheus-stack-(alertmanager-overview|grafana-overview|prometheus)
            patch: |
              - op: replace
                path: /metadata/annotations/grafana_folder
                value: Observability
          - target:
              kind: ConfigMap
              name: kube-prometheus-stack-persistentvolumesusage
            patch: |
              - op: replace
                path: /metadata/annotations/grafana_folder
                value: Storage
  values:
    cleanPrometheusOperatorObjectNames: true
    crds:
      upgradeJob:
        enabled: true
    alertmanager:
      enabled: true
      route:
        main:
          enabled: true
          hostnames: ["alertmanager.${SECRET_DOMAIN}"]
          parentRefs:
            - name: internal
              namespace: kube-system
              sectionName: https
      config:
        route:
          group_by: ["alertname", "namespace", "severity"]
          group_wait: 1m
          group_interval: 10m
          repeat_interval: 12h
          receiver: ntfy
          routes:
            - receiver: "null"
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor|CephNodeNetworkPacketDrops"
            - receiver: "null"
              matchers:
                - severity =~ "info|none"
            - receiver: ntfy
              matchers:
                - severity = "critical"
              repeat_interval: 4h
        # Lists replace chart defaults, so the first four are the chart's own rules.
        inhibit_rules:
          - source_matchers: ['severity = critical']
            target_matchers: ['severity =~ warning|info']
            equal: ['namespace', 'alertname']
          - source_matchers: ['severity = warning']
            target_matchers: ['severity = info']
            equal: ['namespace', 'alertname']
          - source_matchers: ['alertname = InfoInhibitor']
            target_matchers: ['severity = info']
            equal: ['namespace']
          - target_matchers: ['alertname = InfoInhibitor']
          # KEDA scales NFS-backed apps to zero while the NFS server is down.
          - source_matchers: ['alertname = BlackboxProbeFailed', 'instance =~ .+:2049']
            target_matchers: ['depends_on = nfs']
          # Knock-on alerts from a node outage or reboot; NodeRebooted and
          # KubeNodeNotReady still notify, the rest only if they outlast NodeDisrupted.
          - source_matchers: ['alertname = NodeDisrupted']
            target_matchers:
              - alertname =~ "Ceph(OSDDownHigh|OSDDown|OSDHostDown|MonDown|MonDownQuorumAtRisk|MonClockSkew|NodeDiskspaceWarning)|Kube(PodNotReady|DaemonSetRolloutStuck|DaemonSetMisScheduled|DeploymentReplicasMismatch|StatefulSetReplicasMismatch|StatefulSetUpdateNotRolledOut|ClientCertificateExpiration|NodeReadinessFlapping)|KubeletInstanceUnreachable|TargetDown|etcd(HighNumberOfLeaderChanges|MemberCommunicationSlow|HighNumberOfFailedGRPCRequests)"
        receivers:
          - name: "null"
          - name: ntfy
            webhook_configs:
              # The heim-alerts template lives in the ntfy-templates ConfigMap.
              - url: http://ntfy.observability.svc.cluster.local/alerts?template=heim-alerts&markdown=yes&click=https://alertmanager.${SECRET_DOMAIN}
                send_resolved: true
                max_alerts: 10
      alertmanagerSpec:
        externalUrl: https://alertmanager.${SECRET_DOMAIN}
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
          limits:
            memory: 100Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
    customRules:
      KubePodNotReady:
        for: 30m
      KubeDeploymentReplicasMismatch:
        for: 30m
      KubeStatefulSetReplicasMismatch:
        for: 30m
    defaultRules:
      disabled:
        KubeCPUOvercommit: true
        KubeMemoryOvercommit: true
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          hostnames: ["prometheus.${SECRET_DOMAIN}"]
          parentRefs:
            - name: internal
              namespace: kube-system
              sectionName: https
      prometheusSpec:
        externalUrl: https://prometheus.${SECRET_DOMAIN}
        image:
          registry: docker.io
          repository: prompp/prompp
          tag: 2.53.2-0.4.0
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 14d
        retentionSize: 35GB
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 50Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    grafana:
      enabled: false
      forceDeployDashboards: true
      sidecar:
        dashboards:
          annotations:
            grafana_folder: Kubernetes
    nodeExporter:
      operatingSystems:
        aix:
          enabled: false
        darwin:
          enabled: false
    additionalPrometheusRulesMap:
      cert-manager-rules:
        groups:
          - name: cert-manager
            rules:
              - alert: CertificateExpiringSoon
                annotations:
                  summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}; renewal is probably failing.
                expr: certmanager_certificate_expiration_timestamp_seconds - time() < 21 * 86400
                for: 1h
                labels:
                  severity: warning
              - alert: CertificateNotReady
                annotations:
                  summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready.
                expr: certmanager_certificate_ready_status{condition="False"} == 1
                for: 15m
                labels:
                  severity: warning
      flux-rules:
        groups:
          - name: flux
            rules:
              - alert: FluxResourceNotReady
                annotations:
                  summary: Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready ({{ $labels.reason }}).
                expr: flux_resource_info{ready="False", suspended="False"}
                for: 15m
                labels:
                  severity: warning
      node-rules:
        groups:
          - name: node
            rules:
              - alert: NodeRebooted
                annotations:
                  summary: Node {{ $labels.kubernetes_node }} rebooted {{ $value | humanizeDuration }} ago.
                expr: min by (kubernetes_node) (time() - node_boot_time_seconds) < 900
                labels:
                  severity: warning
              # Inhibition source only. Down or unreachable counts for the first hour,
              # so a dead node doesn't hide Ceph and pod alerts indefinitely. Aggregate
              # per node first: exporter pods get new labels when they're rescheduled.
              - alert: NodeDisrupted
                annotations:
                  summary: Node {{ $labels.node }} is down or rebooted in the last 30 minutes.
                expr: |
                  (
                    max by (node) (kube_node_status_condition{condition="Ready", status="true"}) == 0
                    unless max by (node) (max_over_time(kube_node_status_condition{condition="Ready", status="true"}[1h])) == 0
                  )
                  or max by (node) (label_replace(time() - node_boot_time_seconds < 1800, "node", "$1", "kubernetes_node", "(.+)"))
                  or max by (node) (label_replace(
                    max by (kubernetes_node) (up{job="node-exporter"}) == 0
                    unless max by (kubernetes_node) (max_over_time(up{job="node-exporter"}[1h])) == 0,
                    "node", "$1", "kubernetes_node", "(.+)"))
                labels:
                  severity: none
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: warning
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical

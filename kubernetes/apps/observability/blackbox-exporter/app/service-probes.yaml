---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: http-critical
spec:
  module: http_2xx
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        tier: critical
      static:
        - https://passord.${SECRET_DOMAIN}/
        - https://home.${SECRET_DOMAIN}/
        - https://adguard.${SECRET_DOMAIN}/
---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: http-critical-nfs
spec:
  module: http_2xx
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        tier: critical
        depends_on: nfs
      static:
        - https://bilder.${SECRET_DOMAIN}/
---

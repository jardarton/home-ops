---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: volsync
spec:
  groups:
    - name: volsync.rules
      rules:
        - alert: VolSyncComponentAbsent
          expr: |
            absent(up{job="volsync-metrics"})
          annotations:
            summary: >-
              VolSync component has disappeared from Prometheus target discovery
          for: 5m
          labels:
            severity: critical

        # kube-state-metrics reports the ReplicationSources and Destinations that
        # exist; VolSync keeps the metrics of deleted ones until it restarts.
        - alert: VolSyncObjectMetricsAbsent
          expr: |
            absent(kube_customresource_volsync_replicationsource_info)
          annotations:
            summary: >-
              kube-state-metrics reports no ReplicationSources, so VolSyncVolumeOutOfSync cannot fire
          for: 30m
          labels:
            severity: warning

        - alert: VolSyncVolumeOutOfSync
          expr: |
            volsync_volume_out_of_sync == 1
            and on (obj_namespace, obj_name) (
              kube_customresource_volsync_replicationsource_info
              or kube_customresource_volsync_replicationdestination_info
            )
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} volume is out of sync
          for: 5m
          labels:
            severity: critical

        - alert: VolSyncMissedInterval
          expr: |
            increase(volsync_missed_intervals_total{role="source"}[1h]) > 0
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} missed a scheduled backup
          labels:
            severity: warning

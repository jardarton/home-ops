---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app clickhouse
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-v5
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
      # ClickHouse needs AVX2, which hp-3's CPU lacks.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["hp-3"]
    controllers:
      clickhouse:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/clickhouse/clickhouse-server
              tag: 26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
            env:
              # Users come from users.xml; the entrypoint must not rewrite them.
              CLICKHOUSE_SKIP_USER_SETUP: "1"
              CLICKHOUSE_USER: admin
              # Schema in llm.sql is idempotent and applied on every start.
              CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "1"
              TZ: UTC
            envFrom:
              - secretRef:
                  name: clickhouse-secret
            ports:
              - name: http
                containerPort: &httpPort 8123
              - name: native
                containerPort: &nativePort 9000
              - name: metrics
                containerPort: &metricsPort 9363
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *httpPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *httpPort
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/clickhouse
      config:
        type: configMap
        name: clickhouse-config
        globalMounts:
          - path: /etc/clickhouse-server/config.d/server.xml
            subPath: server.xml
            readOnly: true
          - path: /etc/clickhouse-server/users.d/users.xml
            subPath: users.xml
            readOnly: true
          - path: /docker-entrypoint-initdb.d/llm.sql
            subPath: llm.sql
            readOnly: true
    service:
      app:
        ports:
          http:
            port: *httpPort
          native:
            port: *nativePort
          metrics:
            port: *metricsPort
    serviceMonitor:
      app:
        service:
          identifier: app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

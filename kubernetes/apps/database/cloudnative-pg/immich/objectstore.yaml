---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-garage
spec:
  retentionPolicy: 30d
  configuration:
    # Garage on bigbox; objects land under s3://cnpg-backups/<cluster name>/.
    destinationPath: s3://cnpg-backups/
    endpointURL: http://192.168.1.10:3900
    s3Credentials:
      accessKeyId:
        name: cnpg-garage-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-garage-secret
        key: SECRET_ACCESS_KEY
      region:
        name: cnpg-garage-secret
        key: REGION
    wal:
      compression: gzip
      maxParallel: 4
    data:
      compression: gzip
      jobs: 2
  instanceSidecarConfiguration:
    env:
      # Only send S3 checksums when required; Garage does not accept all of them.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi

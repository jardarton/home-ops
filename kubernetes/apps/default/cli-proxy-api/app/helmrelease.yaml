apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cli-proxy-api
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      cli-proxy-api:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/eceasy/cli-proxy-api
              tag: v8.0.22@sha256:fb287227792ae14eff38063479568049c90cb692b1f299e39c6f54650584428f
            command: ["/CLIProxyAPI/CLIProxyAPI"]
            args: ["--config", "/config/config.yaml"]
            env:
              WRITABLE_PATH: /data
              MANAGEMENT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: cli-proxy-api-secret
                    key: management-password
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 2Gi
    persistence:
      auth:
        existingClaim: *app
        globalMounts:
          - path: /data
      config:
        type: secret
        name: cli-proxy-api-secret
        globalMounts:
          - path: /config
            readOnly: true
    service:
      app:
        annotations:
          tailscale.com/expose: "true"
        controller: *app
        ports:
          http:
            port: 8317
    route:
      app:
        hostnames: ["cli-proxy-api.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cli-proxy-api
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      cli-proxy-api:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          plugins:
            image:
              repository: ghcr.io/jardarton/cliproxy-key-scopes
              tag: 01a5bcd@sha256:4557491d2e623eab41e3c1ef322d4a573f4f6222a173ef5ea9c3e8d5b68b9df3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: docker.io/eceasy/cli-proxy-api
              tag: v8.0.29@sha256:b98590c932e2a372e61d53e175a3abe4e8a22118667b2de3ad71514cbf1e3eb6
            command: ["/CLIProxyAPI/CLIProxyAPI"]
            args: ["--config", "/config/config.yaml"]
            env:
              WRITABLE_PATH: /data
              MANAGEMENT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: cli-proxy-api-secret
                    key: management-password
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 2Gi
    persistence:
      auth:
        existingClaim: *app
        globalMounts:
          - path: /data
      plugins:
        type: emptyDir
        advancedMounts:
          cli-proxy-api:
            plugins:
              - path: /plugins
            app:
              - path: /plugins
                readOnly: true
      config:
        type: secret
        name: cli-proxy-api-secret
        globalMounts:
          - path: /config
            readOnly: true
    service:
      app:
        annotations:
          tailscale.com/expose: "true"
        controller: *app
        ports:
          http:
            port: 8317
    route:
      app:
        hostnames: ["cli-proxy-api.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cli-proxy-api
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-v5
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      cli-proxy-api:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          plugins:
            image:
              repository: ghcr.io/jardarton/cliproxy-key-scopes
              tag: f5bc0a2@sha256:d283be5c02f6b69825d826a8b3362199dade88962b1976339cb9042d4d8f8611
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
          capture:
            image:
              repository: ghcr.io/jardarton/cliproxy-capture
              tag: 4bc3459@sha256:5c486afd7ddcbbc977266837bea859f9675e986e6161d0dcc02cf6457d006fbc
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: docker.io/eceasy/cli-proxy-api
              tag: v8.0.62@sha256:c3384886597346937da7d3697150895e0c91ee563172a6053e057d3a1ba9e79c
            command: ["/CLIProxyAPI/CLIProxyAPI"]
            args: ["--config", "/config/config.yaml"]
            env:
              WRITABLE_PATH: /data
              MANAGEMENT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: cli-proxy-api-secret
                    key: management-password
              CAPTURE_CLICKHOUSE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: cli-proxy-api-secret
                    key: capture-clickhouse-password
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 2Gi
    persistence:
      auth:
        existingClaim: *app
        globalMounts:
          - path: /data
      plugins:
        type: emptyDir
        advancedMounts:
          cli-proxy-api:
            capture:
              - path: /plugins
            plugins:
              - path: /plugins
            app:
              - path: /plugins
                readOnly: true
      config:
        type: secret
        name: cli-proxy-api-secret
        globalMounts:
          - path: /config
            readOnly: true
    service:
      app:
        annotations:
          tailscale.com/expose: "true"
        controller: *app
        ports:
          http:
            port: 8317
    route:
      app:
        hostnames: ["cli-proxy-api.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https

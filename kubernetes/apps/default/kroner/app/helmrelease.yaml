# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kroner
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-v5
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      kroner:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            # Only this container sees the superuser password it creates the database with.
            envFrom:
              - secretRef:
                  name: kroner-secret
        containers:
          app:
            image:
              repository: registry.${SECRET_DOMAIN}/kroner
              tag: 483489d@sha256:a9b6c1fe9e0027d0e891dd9394d5fe4610703da10fdefd767f9e968acb70ae03
            env:
              TZ: Europe/Oslo
              # Through the route, and from other namespaces such as Pippi's.
              KRONER_ALLOWED_HOSTS: kroner.${SECRET_DOMAIN},kroner.default.svc.cluster.local,kroner.default.svc
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: kroner-secret
                    key: DATABASE_URL
              KRONER_MCP_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: kroner-secret
                    key: KRONER_MCP_TOKEN
            ports:
              - containerPort: &port 8080
                name: http
                protocol: TCP
            probes:
              # Restart only when the server stops answering; /healthz also
              # needs the database, so it gates traffic instead.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
        pod:
          imagePullSecrets:
            - name: registry-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "kroner.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      # Statements piped to `kroner import -` are copied here for pdftotext.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app calibre-downloader
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-v5
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        # Matches the owner of the NFS ingest share, which CWA reads.
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
    controllers:
      ${APP}:
        containers:
          app:
            image:
              repository: ghcr.io/jardarton/bokhent
              tag: 0.1.0@sha256:03b7bc789c5cfa52d5f01e0d62b789a665895cad7fa7546d6cc494d5215c87e8
            env:
              BOKHENT_ADDR: ":8080"
              BOKHENT_INGEST_DIR: &ingest /cwa-book-ingest
              BOKHENT_SOURCES: url
              BOKHENT_LOG_LEVEL: info
              TZ: Europe/Oslo
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["calibre-downloader.${SECRET_DOMAIN}", "ny-bok.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
    persistence:
      ingest:
        type: nfs
        server: 192.168.1.10
        path: /mnt/wolf/bok/calibre-ingest
        globalMounts:
          - path: *ingest

# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      music-assistant:
        # Bigbox is stopped and /data has been seeded from its offline backup.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # mDNS and AirPlay traffic use the worker's LAN interface directly.
          # Do not combine host networking with a Multus/macvlan attachment.
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: hp-3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 100
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.7.2@sha256:8fc7f780a0a30594e170d5a71138852b1a1e7ce33d2d460e50bf8cadf9eda74f
            env:
              TZ: Europe/Oslo
            resources:
              requests:
                cpu: 100m
                # hp-3 has physical headroom but little unreserved memory.
                # Revisit after measuring this trial; keep the 2 GiB limit.
                memory: 128Mi
              limits:
                memory: 2Gi
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8095
                  periodSeconds: 10
                  timeoutSeconds: 2
    service:
      app:
        controller: music-assistant
        ports:
          http:
            port: 8095
    route:
      app:
        hostnames:
          - "musikk.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      media:
        type: nfs
        server: 192.168.1.10
        path: /mnt/wolf/media/musikk
        globalMounts:
          - path: /music
            readOnly: true
      audio:
        type: emptyDir
        globalMounts:
          - path: /.audio

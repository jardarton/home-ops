# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnodeconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumNodeConfig
metadata:
  name: hp-1-bond
spec:
  # hp-1 runs its uplink through bond0 so netconsole has a device at boot.
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: hp-1
  defaults:
    devices: eth+ bond+

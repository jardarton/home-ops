---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": true,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h",
        "retention": {
          "delay": "24h",
          "policies": [
            {
              "repositories": ["**"],
              "deleteReferrers": true,
              "deleteUntagged": true,
              "keepTags": [
                { "mostRecentlyPushedCount": 10 },
                { "pulledWithin": "720h" }
              ]
            }
          ]
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "realm": "zot",
        "auth": {
          "htpasswd": { "path": "/etc/zot/htpasswd" },
          "failDelay": 5
        },
        "accessControl": {
          "repositories": {
            "**": {
              "policies": [
                { "users": ["admin"], "actions": ["read", "create", "update", "delete"] },
                { "users": ["cluster"], "actions": ["read"] }
              ],
              "defaultPolicy": []
            }
          }
        }
      },
      "log": { "level": "info" },
      "extensions": {
        "search": { "enable": true },
        "ui": { "enable": true },
        "scrub": { "enable": true, "interval": "24h" }
      }
    }
